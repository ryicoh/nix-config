unbind C-b
set -g prefix C-s
bind C-s send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
setw -g mode-keys vi
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

bind-key c run-shell '
  cmd=$(tmux display-message -p "#{pane_current_command}")
  dir=$(tmux display-message -p "#{pane_current_path}")

  case "$cmd" in
    codex|claude)
      tmux new-window -a -t ":{end}" -c "$dir" "zsh -ic \"$cmd; exec zsh\""
      ;;
    *)
      tmux new-window -a -t ":{end}" -c "$dir"
      ;;
  esac
'

bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind C-n next-window
bind C-p previous-window

set -g mouse on
set -g history-limit 100000

set -g status-position top

set -g status-left ""
set -g status-right ""
set -g status-right '#{agent_indicator}'

set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION"

